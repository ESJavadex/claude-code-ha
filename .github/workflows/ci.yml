name: CI

# Small quality gate for the add-on: shell lint, metadata consistency,
# JS syntax and the existing regression suites. No image build here — the
# Home Assistant Supervisor builds the add-on itself from this repository.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ShellCheck (errors and warnings)
        run: shellcheck --severity=warning $(git ls-files '*.sh')

      - name: Add-on metadata checks (YAML, versions, archs)
        run: python3 scripts/check-addon-metadata.py

      - name: JavaScript syntax check
        run: git ls-files '*.js' '*.mjs' | xargs -n1 node --check

      - name: Regression suites
        run: bash tests/run-tests.sh

      # Blocking audit. The only tolerated finding is the unfixable braces
      # advisory; the waiver and its rationale live in the script's header.
      - name: npm audit gate
        run: python3 scripts/npm-audit-gate.py
