---
name: "Claude Terminal Pro"
description: "Enhanced terminal interface for Anthropic's Claude Code CLI with persistent auth, package management, and image paste support. Fork of heytcass/home-assistant-addons"
version: "2.1.7"
slug: "claude_terminal_pro"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64
  - armv7

# External resources
url: "https://github.com/esjavadex/claude-code-ha"

# Web interface configuration
ingress: true
ingress_port: 7680
panel_icon: mdi:code-braces-box
panel_title: "Claude Terminal Pro"
panel_admin: true

# Port configuration
# Both ports are closed by default: ingress reaches 7680 over the internal
# network and needs neither. Neither port has a login of its own.
ports:
  7680/tcp: null
  7681/tcp: null
ports_description:
  7680/tcp: "Direct web UI access (with image paste). Not needed for ingress, and NOT password-protected: anyone who can reach this port gets a root shell in the container, with no Home Assistant login. Leave unset unless the port is firewalled."
  7681/tcp: "Direct ttyd terminal access. Not needed for ingress, and NOT password-protected: anyone who can reach this port gets a root shell in the container, with no Home Assistant login. Leave unset unless the port is firewalled."

# Add-on configuration options
options:
  auto_launch_claude: true
  tmux_mouse: false
  dangerously_skip_permissions: false
  persistent_apk_packages: []
  persistent_pip_packages: []
  use_persistent_claude: false
  auto_update_claude_on_start: false

schema:
  auto_launch_claude: bool?
  tmux_mouse: bool?
  dangerously_skip_permissions: bool?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  use_persistent_claude: bool?
  auto_update_claude_on_start: bool?

# Volume mappings for file access
map:
  - config:rw    # Access to Home Assistant configuration files

# API access for Home Assistant integration
# No auth_api: it grants only http://supervisor/auth, which validates a Home
#   Assistant username and password. Nothing here calls it.
hassio_api: true
hassio_role: manager
homeassistant_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7680]/
