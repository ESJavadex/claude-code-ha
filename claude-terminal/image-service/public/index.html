<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget shrinks the layout viewport when the keyboard opens,
         so 100vh and the iframe shrink with it. The default, resizes-visual,
         leaves layout alone and the prompt stays behind the keyboard until
         something else forces a redraw. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Claude Terminal Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* Height is overwritten in px from visualViewport once the on-screen
           keyboard is up - 100vh ignores it. See trackOnScreenKeyboard(). */
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background: #2d2d2d;
            padding: 8px 16px;
            border-bottom: 1px solid #3d3d3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        #header-title {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }

        /* One fixed height for every header button. Emoji sit on a larger em
           box than the label text, so without this each button takes its height
           from its own icon and the row comes out ragged. */
        .header-btn {
            background: #007acc;
            color: white;
            border: none;
            height: 30px;
            padding: 0 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* The icon span: sized on its own so it cannot stretch the button. */
        .header-btn > span:first-child {
            font-size: 14px;
            line-height: 1;
            display: block;
        }

        .header-btn:hover {
            background: #005a9e;
        }

        .header-btn:active {
            background: #004578;
        }

        .header-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #voice-btn.recording {
            background: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #status {
            font-size: 12px;
            color: #888;
            padding: 0 12px;
            transition: all 0.2s ease;
        }

        #status.success {
            color: #4ec9b0;
        }

        #status.error {
            color: #f48771;
        }

        #status:hover {
            opacity: 0.8;
        }

        #status[style*="cursor: pointer"] {
            user-select: all;
        }

        #terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #1e1e1e;
        }

        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 122, 204, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
        }

        #drop-zone-text {
            font-size: 24px;
            font-weight: 500;
            color: white;
            text-align: center;
        }

        #file-input {
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Voice Modal */
        #voice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #voice-modal.active {
            display: flex;
        }

        #voice-modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3d3d3d;
        }

        #voice-modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #fff;
        }

        #voice-transcript {
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
        }

        #voice-transcript.listening {
            border-color: #d9534f;
        }

        #voice-transcript:empty::before {
            content: "Click 'Start Recording' and speak...";
            color: #666;
            font-style: italic;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .modal-btn-primary {
            background: #007acc;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #005a9e;
        }

        .modal-btn-danger {
            background: #d9534f;
            color: white;
        }

        .modal-btn-danger:hover {
            background: #c9302c;
        }

        .modal-btn-secondary {
            background: #555;
            color: white;
        }

        .modal-btn-secondary:hover {
            background: #666;
        }

        #voice-status {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            min-height: 18px;
        }

        #voice-status.listening {
            color: #d9534f;
        }

        /* Copy modal: the only way to copy on a touch device, where xterm.js
           has no selection at all. */
        #copy-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #copy-modal.active {
            display: flex;
        }

        #copy-modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 16px;
            max-width: 700px;
            width: 94%;
            border: 1px solid #3d3d3d;
        }

        #copy-modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #fff;
        }

        #copy-hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        /* A real textarea, so a long-press gives the native mobile
           selection handles and the OS copy menu. */
        #copy-text {
            width: 100%;
            height: 45vh;
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px;
            color: #ddd;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre;
            overflow: auto;
            resize: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .copy-options {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 10px 0;
            font-size: 12px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .copy-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #copy-status {
            font-size: 12px;
            color: #888;
            min-height: 18px;
            margin-bottom: 8px;
        }

        #copy-status.success {
            color: #5cb85c;
        }

        #copy-status.error {
            color: #d9534f;
        }

        /* The link button appears on its own when a URL shows up in the
           terminal, so copying an OAuth link is one tap and no selecting. */
        #link-btn {
            background: #2ea043;
        }

        #link-btn:hover {
            background: #268a39;
        }

        #link-btn.copied {
            background: #1a7f37;
        }

        /* Phones: the button labels do not fit next to the title. */
        @media (max-width: 700px) {
            #header-title {
                display: none;
            }

            #header {
                justify-content: flex-end;
            }

            /* Icon-only, so make them square rather than letting the padding
               decide the width per emoji. */
            .header-btn {
                width: 38px;
                height: 34px;
                padding: 0;
            }

            .header-btn > span:first-child {
                font-size: 16px;
            }

            .header-btn .btn-label {
                display: none;
            }

            .modal-buttons {
                flex-wrap: wrap;
            }

            .modal-btn {
                flex: 1 1 auto;
                padding: 12px 16px;
                font-size: 14px;
            }

            #copy-text {
                height: 40vh;
                font-size: 13px;
            }
        }

        /* Sidebar: file tree, recently changed files and the HA config check */
        #main {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        /* On the right of the terminal. Collapsed, it shrinks to a thin rail
           with buttons to open it again, so it never disappears entirely. */
        #sidebar {
            width: 300px;
            flex-shrink: 0;
            background: #252526;
            border-left: 1px solid #3d3d3d;
            display: flex;
            flex-direction: column;
            min-height: 0;
            font-size: 13px;
            position: relative;
        }

        #sidebar.collapsed {
            width: 36px !important;
        }

        #sidebar.collapsed > :not(#sidebar-rail) {
            display: none !important;
        }

        #sidebar-rail {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding-top: 6px;
        }

        #sidebar.collapsed #sidebar-rail {
            display: flex;
        }

        .rail-btn {
            width: 28px;
            height: 28px;
            background: none;
            border: none;
            border-radius: 4px;
            color: #aaa;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
        }

        .rail-btn:hover {
            background: #37373d;
            color: #fff;
        }

        #sidebar-tabs {
            display: flex;
            border-bottom: 1px solid #3d3d3d;
            flex-shrink: 0;
        }

        .sidebar-tab {
            flex: 1;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #aaa;
            padding: 8px 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .sidebar-tab.active {
            color: #fff;
            border-bottom-color: #007acc;
        }

        #sidebar-hide {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: #888;
            padding: 8px 10px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        #sidebar-hide:hover {
            color: #fff;
        }

        /* Drag to resize. Sits on the sidebar's left edge. */
        #sidebar-resizer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -3px;
            width: 6px;
            cursor: col-resize;
            background: transparent;
            z-index: 5;
        }

        #sidebar-resizer:hover,
        #sidebar-resizer.dragging {
            background: #007acc;
        }

        /* While dragging, the iframe would swallow mouse events */
        body.resizing #terminal-frame {
            pointer-events: none;
        }

        #sidebar-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-bottom: 1px solid #333;
            color: #888;
            font-size: 11px;
            flex-shrink: 0;
        }

        #sidebar-toolbar label {
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        #sidebar-refresh {
            margin-left: auto;
            background: none;
            border: 1px solid #444;
            color: #ccc;
            border-radius: 3px;
            cursor: pointer;
            padding: 2px 8px;
            font-size: 11px;
        }

        #sidebar-list {
            flex: 1;
            overflow: auto;
            padding: 4px 0;
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            cursor: pointer;
            white-space: nowrap;
            color: #ddd;
            user-select: none;
        }

        .tree-row:hover {
            background: #2a2d2e;
        }

        .tree-row.selected {
            background: #094771;
        }

        .tree-twisty {
            width: 12px;
            color: #888;
            flex-shrink: 0;
            text-align: center;
        }

        .tree-name {
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-meta {
            margin-left: auto;
            padding-left: 8px;
            color: #777;
            font-size: 11px;
        }

        .tree-empty {
            color: #777;
            padding: 6px 12px;
            font-style: italic;
        }

        #sidebar-footer {
            border-top: 1px solid #3d3d3d;
            padding: 8px;
            flex-shrink: 0;
        }

        #check-config-btn {
            width: 100%;
            background: #1a7f37;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px;
            cursor: pointer;
            font-size: 12px;
        }

        #check-config-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #check-config-result {
            margin-top: 6px;
            font-size: 11px;
            color: #aaa;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow: auto;
        }

        #check-config-result.ok { color: #4ec9b0; }
        #check-config-result.error { color: #f48771; }

        .change-status {
            width: 14px;
            flex-shrink: 0;
            font-weight: 600;
            font-family: Menlo, Consolas, monospace;
            text-align: center;
        }

        .change-status.modified { color: #e2c08d; }
        .change-status.added { color: #73c991; }
        .change-status.deleted { color: #f48771; }
        .change-status.renamed { color: #75beff; }

        .changes-note {
            color: #aaa;
            padding: 10px 12px;
            line-height: 1.5;
            font-size: 12px;
        }

        .changes-note button {
            margin-top: 10px;
            width: 100%;
        }

        .sidebar-action {
            background: #007acc;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px;
            cursor: pointer;
            font-size: 12px;
        }

        .sidebar-action:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #accept-changes-btn {
            width: 100%;
            margin-bottom: 6px;
            display: none;
        }

        .diff-line { display: block; }
        .diff-add { background: rgba(115, 201, 145, 0.15); color: #9fe0b5; }
        .diff-del { background: rgba(244, 135, 113, 0.15); color: #f8a898; }
        .diff-hunk { color: #75beff; }
        .diff-meta { color: #888; }

        #preview-revert-btn.confirm {
            background: #d9534f;
            color: #fff;
        }

        #preview-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #preview-modal.active {
            display: flex;
        }

        #preview-modal-content {
            background: #2d2d2d;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            padding: 16px;
            width: 94%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        #preview-title {
            font-size: 14px;
            color: #ddd;
            word-break: break-all;
            margin-bottom: 4px;
        }

        #preview-meta {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
        }

        #preview-body {
            flex: 1;
            overflow: auto;
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px;
            font-family: Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre;
            color: #d4d4d4;
            min-height: 120px;
        }

        /* Phones: the sidebar covers the terminal instead of squeezing it */
        @media (max-width: 700px) {
            #sidebar-resizer {
                display: none !important;
            }

            #sidebar:not(.collapsed) {
                position: absolute;
                top: 0;
                bottom: 0;
                right: 0;
                width: 100% !important;
                z-index: 1500;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="header-title">Claude Terminal Pro<span id="addon-version"></span> - Voice & image support</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="status"></span>
                <button id="files-btn" class="header-btn" title="Browse /config, recent changes and check the HA configuration">
                    <span>🗂️</span>
                    <span class="btn-label">Files</span>
                </button>
                <button id="link-btn" class="header-btn" title="Copy the link shown in the terminal" style="display: none;">
                    <span>🔗</span>
                    <span class="btn-label">Copy link</span>
                </button>
                <button id="copy-btn" class="header-btn" title="Copy terminal text">
                    <span>📋</span>
                    <span class="btn-label">Copy</span>
                </button>
                <button id="voice-btn" class="header-btn">
                    <span>🎤</span>
                    <span class="btn-label">Voice Input</span>
                </button>
                <button id="upload-btn" class="header-btn">
                    <span>📎</span>
                    <span class="btn-label">Upload Image</span>
                </button>
            </div>
        </div>
        <div id="main">
            <div id="terminal-container">
                <iframe id="terminal-frame" src="about:blank"></iframe>
                <div id="drop-zone">
                    <div id="drop-zone-text">Drop image here to upload</div>
                </div>
            </div>
            <div id="sidebar" class="collapsed">
                <div id="sidebar-resizer" title="Drag to resize"></div>
                <div id="sidebar-rail">
                    <button class="rail-btn" id="rail-expand" title="Show the sidebar">«</button>
                    <button class="rail-btn" data-open-tab="files" title="Files">📁</button>
                    <button class="rail-btn" data-open-tab="recent" title="Recent changes">🕒</button>
                    <button class="rail-btn" data-open-tab="changes" title="Changes since the last checkpoint">±</button>
                </div>
                <div id="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="files">📁 Files</button>
                    <button class="sidebar-tab" data-tab="recent">🕒 Recent</button>
                    <button class="sidebar-tab" data-tab="changes">± Changes</button>
                    <button id="sidebar-hide" title="Hide the sidebar">»</button>
                </div>
                <div id="sidebar-toolbar">
                    <label id="hidden-toggle"><input type="checkbox" id="show-hidden"> Hidden files</label>
                    <select id="recent-hours" style="display: none;">
                        <option value="1">Last hour</option>
                        <option value="24" selected>Last 24 hours</option>
                        <option value="168">Last 7 days</option>
                    </select>
                    <button id="sidebar-refresh" title="Refresh">↻</button>
                </div>
                <div id="sidebar-list"></div>
                <div id="sidebar-footer">
                    <button id="accept-changes-btn" class="sidebar-action" title="Save the current state as the new checkpoint (a local git commit, never pushed)">✓ Accept all changes</button>
                    <button id="check-config-btn" title="Run Home Assistant's configuration check (ha core check)">✓ Check HA configuration</button>
                    <div id="check-config-result"></div>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <!-- File preview (read-only) -->
    <div id="preview-modal">
        <div id="preview-modal-content">
            <div id="preview-title"></div>
            <div id="preview-meta"></div>
            <div id="preview-body"></div>
            <div class="modal-buttons">
                <button id="preview-insert-btn" class="modal-btn modal-btn-primary" title="Type the path at the terminal prompt">Insert path</button>
                <button id="preview-copy-btn" class="modal-btn modal-btn-secondary">Copy path</button>
                <button id="preview-revert-btn" class="modal-btn modal-btn-secondary" style="display: none;" title="Put this file back as it was at the last checkpoint">↩ Revert file</button>
                <button id="preview-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Copy Modal: touch devices cannot select terminal text at all -->
    <div id="copy-modal">
        <div id="copy-modal-content">
            <div id="copy-modal-title">📋 Copy terminal text</div>
            <div id="copy-hint">Long-press in the box to select part of it, or use "Copy all".</div>
            <div id="copy-status"></div>
            <textarea id="copy-text" readonly spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
            <div class="copy-options">
                <label><input type="radio" name="copy-scope" value="screen" checked> Visible screen</label>
                <label><input type="radio" name="copy-scope" value="all"> Full scrollback</label>
                <label id="copy-scope-selection" style="display: none;"><input type="radio" name="copy-scope" value="selection"> Selection</label>
            </div>
            <div class="copy-options">
                <label title="tmux breaks long lines at the pane width; rejoining them keeps URLs in one piece">
                    <input type="checkbox" id="copy-join" checked> Rejoin wrapped lines
                </label>
            </div>
            <div class="modal-buttons">
                <button id="copy-url-btn" class="modal-btn modal-btn-primary" style="display: none;">Copy link</button>
                <button id="copy-all-btn" class="modal-btn modal-btn-primary">Copy all</button>
                <button id="copy-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Voice Input Modal -->
    <div id="voice-modal">
        <div id="voice-modal-content">
            <div id="voice-modal-title">🎤 Voice Input</div>
            <div id="voice-status"></div>
            <div id="voice-transcript" contenteditable="true"></div>
            <div class="modal-buttons">
                <button id="voice-record-btn" class="modal-btn modal-btn-danger">Start Recording</button>
                <button id="voice-copy-btn" class="modal-btn modal-btn-primary" style="display: none;">Copy Text</button>
                <button id="voice-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script src="terminal-clipboard.js"></script>
    <script>
        let ttydPort = 7681;
        let uploadDir = '/data/images';

        // Fetch configuration and load ttyd
        // Use relative paths for Home Assistant ingress compatibility
        fetch('config')
            .then(res => res.json())
            .then(config => {
                ttydPort = config.ttydPort;
                uploadDir = config.uploadDir;
                if (config.version) {
                    document.getElementById('addon-version').textContent = ' v' + config.version;
                }
                console.log('Config loaded:', config);
                // Load ttyd via proxy endpoint
                loadTerminal();
            })
            .catch(err => {
                console.error('Failed to load config:', err);
                // Fallback: load terminal anyway
                loadTerminal();
            });

        function loadTerminal() {
            const iframe = document.getElementById('terminal-frame');
            // Use relative path for Home Assistant ingress compatibility
            iframe.src = 'terminal/';
            // ttyd cannot copy an xterm.js selection on its own, and ignores OSC 52
            installTerminalClipboard(iframe);
            // Paste events fire inside the (same-origin) iframe while the terminal
            // has focus, so the parent document's listener never sees them.
            iframe.addEventListener('load', () => installImagePaste(iframe));
            // Without a dark color scheme the browser draws xterm's scrollbar
            // light, a white band down the terminal's right edge
            iframe.addEventListener('load', () => {
                try {
                    iframe.contentDocument.documentElement.style.colorScheme = 'dark';
                    iframe.contentDocument.body.style.background = '#1e1e1e';
                } catch { /* not same-origin */ }
            });
        }

        // Async Clipboard API path (needs HTTPS or localhost; prompts for permission once).
        async function pasteFromAsyncClipboard(win) {
            const term = win.term;
            if (!navigator.clipboard || !navigator.clipboard.read) {
                setStatus('Ctrl+V needs HTTPS here - use Cmd+V, drag-drop or 📎', 'error');
                return;
            }
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    const type = item.types.find(t => t.startsWith('image/'));
                    if (type) {
                        const blob = await item.getType(type);
                        const ext = type.split('/')[1].replace('svg+xml', 'svg');
                        await uploadImage(new File([blob], `pasted.${ext}`, { type }));
                        return;
                    }
                }
                // Prefer text/plain from the same read() so we stay within the user
                // activation (Safari rejects a second clipboard call after awaits).
                const textItem = items.find(i => i.types.includes('text/plain'));
                const text = textItem
                    ? await (await textItem.getType('text/plain')).text()
                    : await navigator.clipboard.readText();
                if (text && term) term.paste(text);
            } catch (err) {
                console.log('Async clipboard read failed:', err);
                setStatus('Clipboard read blocked - use Cmd+V, drag-drop or 📎', 'error');
            }
        }

        // Intercept image pastes inside the terminal frame before xterm.js does.
        // Text pastes are left alone so xterm handles them (incl. bracketed paste).
        function installImagePaste(iframe) {
            let win;
            try { win = iframe.contentWindow; win.document; } catch { return; }
            if (!win || win.__imagePasteInstalled) return;
            win.__imagePasteInstalled = true;
            const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

            // Ctrl+V reaches the pty as ^V (0x16). Claude Code treats that as "paste image
            // from the system clipboard" - the container's, which is empty - hence
            // "No image found in clipboard". Keep ^V away from xterm.
            win.addEventListener('keydown', async (e) => {
                if (!(e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'v' || e.key === 'V'))) return;
                e.stopImmediatePropagation();
                if (!isMac) return; // Windows/Linux: default action fires a real paste event
                // macOS: Ctrl+V fires no paste event, so read the clipboard ourselves.
                e.preventDefault();
                await pasteFromAsyncClipboard(win);
            }, true);
            win.addEventListener('paste', async (e) => {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        const file = item.getAsFile();
                        if (file) await uploadImage(file);
                        return;
                    }
                }
            }, true);
        }

        // Fixes mouse-selection copy and Claude Code's /copy (OSC 52) inside ttyd.
        let clipboardBridge = null;

        function installTerminalClipboard(iframe) {
            const bridge = window.ClaudeTerminalClipboard;
            if (!bridge) {
                console.warn('terminal-clipboard.js not loaded, terminal copy will not work');
                return;
            }
            clipboardBridge = bridge.attach(iframe, {
                onError: (err) => console.error('Clipboard bridge failed:', err),
                onTimeout: () => console.warn('Terminal did not expose window.term, clipboard bridge inactive'),
                // Only reachable for /copy on a plain-HTTP origin, where the
                // browser has no clipboard API and refuses the fallback without
                // a user gesture. Say so and point at a button that has one.
                onRefused: () => setStatus(
                    'The browser blocked /copy over plain HTTP — use 📋 instead (or open Home Assistant over HTTPS)',
                    'error',
                    true
                )
            });
        }

        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        function setStatus(message, type = '', persistent = false) {
            status.textContent = message;
            status.className = type;
            if (message && !persistent) {
                setTimeout(() => setStatus(''), 5000);
            }
        }

        async function uploadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                setStatus('Please select an image file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            uploadBtn.innerHTML = '<span class="spinner"></span><span>Uploading...</span>';
            uploadBtn.disabled = true;

            try {
                // Use relative path for Home Assistant ingress compatibility
                const response = await fetch('upload', {
                    method: 'POST',
                    body: formData
                });

                // Check if response is ok (status 200-299)
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Upload failed';
                    try {
                        const errorJson = JSON.parse(text);
                        errorMessage = errorJson.error || errorMessage;
                    } catch {
                        errorMessage = text || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.success) {
                    const filePath = result.path;

                    // Display full path persistently with click-to-copy functionality
                    setStatus(`📋 ${filePath} (click to select)`, 'success', true);
                    console.log('Image uploaded:', filePath);

                    // Make status clickable to select text (works in iframes)
                    status.style.cursor = 'pointer';
                    status.style.userSelect = 'text';

                    status.onclick = () => {
                        // Try modern clipboard API first
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(filePath)
                                .then(() => {
                                    const originalText = status.textContent;
                                    setStatus('✓ Copied!', 'success', false);
                                    setTimeout(() => {
                                        setStatus(originalText, 'success', true);
                                    }, 2000);
                                })
                                .catch(() => {
                                    selectText();
                                });
                        } else {
                            // Fallback: select the text so user can copy with Cmd+C
                            selectText();
                        }
                    };

                    // Insert the path at the terminal prompt
                    autoCopyAndPaste(filePath);

                    // Helper to select text (works in all contexts)
                    function selectText() {
                        const range = document.createRange();
                        const selection = window.getSelection();

                        // Clear any existing selection
                        selection.removeAllRanges();

                        // Create a temporary text node with just the path
                        const tempDiv = document.createElement('div');
                        tempDiv.style.position = 'absolute';
                        tempDiv.style.left = '-9999px';
                        tempDiv.textContent = result.path;
                        document.body.appendChild(tempDiv);

                        // Select the path text
                        range.selectNodeContents(tempDiv);
                        selection.addRange(range);

                        // Try execCommand as fallback for copying
                        try {
                            const copied = document.execCommand('copy');
                            if (copied) {
                                setStatus('✓ Copied! (Cmd+C)', 'success', false);
                            } else {
                                setStatus('✓ Selected! Press Cmd+C to copy', 'success', false);
                            }
                        } catch (err) {
                            setStatus('✓ Selected! Press Cmd+C to copy', 'success', false);
                        }

                        // Clean up and restore message
                        setTimeout(() => {
                            document.body.removeChild(tempDiv);
                            selection.removeAllRanges();
                            setStatus(`📋 ${result.path} (click to select)`, 'success', true);
                        }, 3000);
                    }
                } else {
                    setStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                setStatus('Upload failed: ' + error.message, 'error');
            } finally {
                uploadBtn.innerHTML = '<span>📎</span><span>Upload Image</span>';
                uploadBtn.disabled = false;
            }
        }

        // Upload button click
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadImage(e.target.files[0]);
            }
        });

        // Paste handling
        document.addEventListener('paste', async (e) => {
            console.log('Paste event detected');
            const items = e.clipboardData?.items;

            if (!items) {
                console.log('No clipboard items found');
                return;
            }

            console.log('Clipboard items:', Array.from(items).map(i => i.type));

            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    console.log('Image found in clipboard:', item.type);
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        console.log('File extracted from clipboard:', file.name, file.size);
                        await uploadImage(file);
                    } else {
                        console.error('Failed to extract file from clipboard item');
                    }
                    break;
                }
            }
        });

        // Also handle paste on window for better compatibility
        window.addEventListener('paste', async (e) => {
            // This ensures paste works even when iframe has focus
            console.log('Window paste event detected');
        });

        // Drag and drop handling
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            const files = e.dataTransfer?.files;
            if (files && files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    await uploadImage(file);
                } else {
                    setStatus('Please drop an image file', 'error');
                }
            }
        });

        // Insert the uploaded path at the prompt via xterm's own paste API.
        // Does not overwrite the user's clipboard.
        async function autoCopyAndPaste(filePath) {
            const iframe = document.getElementById('terminal-frame');
            try {
                const term = iframe.contentWindow.term;
                if (term && typeof term.paste === 'function') {
                    term.paste(filePath + ' ');
                    term.focus();
                    setStatus(`📋 ${filePath} - inserted at prompt`, 'success', true);
                    return;
                }
            } catch (err) {
                console.log('Cannot reach terminal for auto-insert:', err);
            }
            setStatus(`📋 ${filePath} (click to copy)`, 'success', true);
        }

        // Helper to copy text to clipboard
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback:', err);
                    return fallbackCopyToClipboard(text);
                }
            } else {
                return fallbackCopyToClipboard(text);
            }
        }

        // Fallback clipboard copy using execCommand
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'absolute';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                const copied = document.execCommand('copy');
                document.body.removeChild(textArea);
                return copied;
            } catch (err) {
                document.body.removeChild(textArea);
                return false;
            }
        }

        // Prevent default drag behavior on iframe
        window.addEventListener('load', () => {
            const iframe = document.getElementById('terminal-frame');
            iframe.addEventListener('dragover', (e) => e.preventDefault());
            iframe.addEventListener('drop', (e) => e.preventDefault());
        });

        // --- Copy terminal text: the only path a touch device has ---
        // xterm.js has no touch selection and paints to a canvas, so a finger
        // selects nothing. Read the buffer into a textarea instead, where a
        // long-press gives the native handles.

        const copyModal = document.getElementById('copy-modal');
        const copyBtn = document.getElementById('copy-btn');
        const copyTextArea = document.getElementById('copy-text');
        const copyStatus = document.getElementById('copy-status');
        const copyAllBtn = document.getElementById('copy-all-btn');
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const copyCloseBtn = document.getElementById('copy-close-btn');
        const copyScopeSelection = document.getElementById('copy-scope-selection');
        const copyJoin = document.getElementById('copy-join');

        function currentCopyScope() {
            const checked = document.querySelector('input[name="copy-scope"]:checked');
            return checked ? checked.value : 'screen';
        }

        function setCopyStatus(message, type = '') {
            copyStatus.textContent = message;
            copyStatus.className = type;
        }

        function terminalController() {
            return clipboardBridge ? clipboardBridge.getController() : null;
        }

        function refreshCopyText() {
            const controller = terminalController();
            if (!controller) {
                copyTextArea.value = '';
                setCopyStatus('Terminal is not ready yet.', 'error');
                return;
            }
            copyTextArea.value = controller.read(currentCopyScope(), copyJoin.checked);

            // Ask the terminal, not the textarea: rebuilding a link that was
            // split across rows needs the row geometry, which the flattened
            // text no longer has.
            const found = controller.findLink();
            copyUrlBtn.style.display = found.url ? 'block' : 'none';
            copyUrlBtn.dataset.url = found.url || '';
            if (found.url) {
                setCopyStatus('Found a link — "Copy link" copies just that.');
            } else if (found.problem === 'truncated') {
                setCopyStatus('A link is on screen but cut off — try "Full scrollback".', 'error');
            } else {
                setCopyStatus('');
            }
        }

        function openCopyModal() {
            const controller = terminalController();
            // Only offer the "Selection" scope when there actually is one
            // (desktop with a mouse); on a phone there never is.
            const hasSelection = !!(controller && controller.hasSelection());
            copyScopeSelection.style.display = hasSelection ? 'flex' : 'none';
            if (hasSelection) {
                copyScopeSelection.querySelector('input').checked = true;
            } else if (currentCopyScope() === 'selection') {
                document.querySelector('input[name="copy-scope"][value="screen"]').checked = true;
            }

            refreshCopyText();
            copyModal.classList.add('active');
        }

        function closeCopyModal() {
            copyModal.classList.remove('active');
            setCopyStatus('');
        }

        copyBtn.addEventListener('click', openCopyModal);
        copyCloseBtn.addEventListener('click', closeCopyModal);
        copyModal.addEventListener('click', (e) => {
            if (e.target === copyModal) closeCopyModal();
        });
        document.querySelectorAll('input[name="copy-scope"]').forEach((radio) => {
            radio.addEventListener('change', refreshCopyText);
        });
        copyJoin.addEventListener('change', refreshCopyText);

        copyUrlBtn.addEventListener('click', async () => {
            const url = copyUrlBtn.dataset.url;
            if (!url) return;

            if (await copyToClipboard(url)) {
                setCopyStatus(`✓ Copied the link (${url.length} chars).`, 'success');
                return;
            }
            // Select just the link so the OS copy menu picks it up.
            const at = copyTextArea.value.indexOf(url);
            copyTextArea.focus();
            if (at !== -1) copyTextArea.setSelectionRange(at, at + url.length);
            setCopyStatus('Could not copy automatically - the link is selected, use your device\'s Copy.', 'error');
        });

        // The tap on this button is the user gesture that the execCommand
        // fallback needs, so this works on plain HTTP too.
        copyAllBtn.addEventListener('click', async () => {
            const text = copyTextArea.value;
            if (!text) {
                setCopyStatus('Nothing to copy.', 'error');
                return;
            }

            if (await copyToClipboard(text)) {
                setCopyStatus(`✓ Copied ${text.split('\n').length} lines.`, 'success');
                return;
            }

            // Last resort: hand it to the OS selection UI.
            copyTextArea.focus();
            copyTextArea.setSelectionRange(0, text.length);
            setCopyStatus('Could not copy automatically - the text is selected, use your device\'s Copy.', 'error');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && copyModal.classList.contains('active')) closeCopyModal();
        });

        // --- Keep the prompt above the on-screen keyboard ---
        // interactive-widget in the viewport meta does this on Chrome. Safari
        // ignores it, so follow the visual viewport as well; shrinking the
        // container makes the iframe fire resize and ttyd refits.
        //
        // Inside Home Assistant this page is the ingress iframe, and on iOS the
        // keyboard shrinks only the top window's visual viewport; the iframe's
        // own stays full height, so nothing moved until a keystroke made iOS
        // scroll. Ingress is same-origin, so follow the top window's viewport
        // too and keep to the part of this frame above the keyboard.

        // The top window and where this frame starts in it, or null when this
        // page is the top window or a parent is cross-origin.
        function outerViewport() {
            try {
                let win = window;
                let frameTop = 0;
                while (win.parent !== win) {
                    const frame = win.frameElement;
                    if (!frame) return null;
                    frameTop += frame.getBoundingClientRect().top;
                    win = win.parent;
                }
                if (win === window || !win.visualViewport) return null;
                return { win, viewport: win.visualViewport, frameTop };
            } catch (e) {
                return null;
            }
        }

        function trackOnScreenKeyboard() {
            const viewport = window.visualViewport;
            const container = document.getElementById('container');
            if (!viewport || !container) return;

            let settle;

            const visibleHeight = () => {
                let height = viewport.height;
                const outer = outerViewport();
                // Only while the keyboard (or a pinch-zoom) has made the top
                // viewport shorter than the top window. Otherwise this frame may
                // just be a dashboard card scrolled partly off screen, and
                // clamping would cut it to what was visible at load.
                if (outer && outer.viewport.height < outer.win.innerHeight - 1) {
                    const bottom = outer.viewport.offsetTop + outer.viewport.height;
                    height = Math.min(height, bottom - outer.frameTop);
                }
                return height;
            };

            const apply = () => {
                const height = visibleHeight();
                // A bogus height would collapse the terminal entirely.
                if (height < 120) return;
                container.style.height = height + 'px';
                // iOS pans the layout viewport when an input takes focus.
                window.scrollTo(0, 0);

                // The keyboard animates, so the height arrives in steps. Pin to
                // the bottom once it stops moving, rather than on every step -
                // otherwise the view only catches up when something else
                // redraws, which is why it used to wait for a keystroke.
                clearTimeout(settle);
                settle = setTimeout(() => {
                    const controller = terminalController();
                    if (controller) controller.scrollToBottom();
                }, 150);
            };

            viewport.addEventListener('resize', apply);
            viewport.addEventListener('scroll', apply);
            const outer = outerViewport();
            if (outer) {
                outer.viewport.addEventListener('resize', apply);
                outer.viewport.addEventListener('scroll', apply);
            }
            apply();
        }

        trackOnScreenKeyboard();

        // --- One-tap link copy ---
        // What people copy is almost always a login URL, and selecting it by
        // finger is painful even above. Watch for one and offer a button; the
        // tap is also the gesture the execCommand fallback needs.

        const linkBtn = document.getElementById('link-btn');
        let pendingLink = null;

        const LINK_PROBLEM_MESSAGE = {
            none: 'No link on screen',
            truncated: 'The link on screen is cut off - scroll so all of it is visible',
            invalid: 'That does not look like a complete link'
        };

        function scanForLink() {
            const controller = terminalController();
            if (!controller) return;

            const url = controller.findLink().url;
            if (url === pendingLink) return;

            pendingLink = url;
            linkBtn.style.display = url ? 'inline-flex' : 'none';
            linkBtn.classList.remove('copied');
            // Shows the host on hover, so it is obvious what will be copied.
            linkBtn.title = url ? `Copy ${url}` : 'Copy the link shown in the terminal';
        }

        setInterval(scanForLink, 1500);

        linkBtn.addEventListener('click', async () => {
            // Re-check on the tap rather than trusting the 1.5s poll: the
            // screen may have changed, and a stale truncated link is exactly
            // the "unfinished http..." that is worse than no link at all.
            const controller = terminalController();
            const found = controller ? controller.findLink() : { url: null, problem: 'none' };

            if (!found.url) {
                pendingLink = null;
                linkBtn.style.display = 'none';
                setStatus(LINK_PROBLEM_MESSAGE[found.problem] || LINK_PROBLEM_MESSAGE.none, 'error');
                return;
            }

            pendingLink = found.url;
            if (await copyToClipboard(found.url)) {
                linkBtn.classList.add('copied');
                // Name the host: on a phone there is no hover, so this is the
                // only way to see which link was taken when several are up.
                let host = found.url;
                try { host = new URL(found.url).host; } catch (err) { /* keep the raw URL */ }
                setStatus(`✓ Copied link to ${host} (${found.url.length} chars)`, 'success');
                return;
            }

            // Copy was refused: fall back to the dialog, where the link is
            // preselected for the OS copy menu.
            setStatus('Could not copy automatically - opening the copy dialog', 'error');
            openCopyModal();
            const at = copyTextArea.value.indexOf(found.url);
            if (at !== -1) {
                copyTextArea.focus();
                copyTextArea.setSelectionRange(at, at + found.url.length);
            }
        });

        // ========================================
        // Voice Input with Web Speech API
        // ========================================

        const voiceBtn = document.getElementById('voice-btn');
        const voiceModal = document.getElementById('voice-modal');
        const voiceRecordBtn = document.getElementById('voice-record-btn');
        const voiceCopyBtn = document.getElementById('voice-copy-btn');
        const voiceCloseBtn = document.getElementById('voice-close-btn');
        const voiceTranscript = document.getElementById('voice-transcript');
        const voiceStatus = document.getElementById('voice-status');

        let recognition = null;
        let isRecording = false;

        // Check if Web Speech API is supported
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // Default to English, can be made configurable

            console.log('Web Speech API is supported!');
        } else {
            console.warn('Web Speech API is not supported in this browser');
            voiceBtn.disabled = true;
            voiceBtn.title = 'Voice input not supported in this browser';
        }

        // Open voice modal
        voiceBtn.addEventListener('click', () => {
            voiceModal.classList.add('active');
            voiceTranscript.textContent = '';
            voiceStatus.textContent = '';
            voiceCopyBtn.style.display = 'none';
        });

        // Close voice modal
        voiceCloseBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            }
            voiceModal.classList.remove('active');
        });

        // Click outside modal to close
        voiceModal.addEventListener('click', (e) => {
            if (e.target === voiceModal) {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }
        });

        // Start/Stop recording
        voiceRecordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        function startRecording() {
            if (!recognition) {
                voiceStatus.textContent = '❌ Speech recognition not available';
                voiceStatus.className = 'error';
                return;
            }

            isRecording = true;
            voiceRecordBtn.textContent = 'Stop Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-danger';
            voiceStatus.textContent = '🎤 Listening... (speak now)';
            voiceStatus.classList.add('listening');
            voiceTranscript.classList.add('listening');

            let finalTranscript = '';
            let interimTranscript = '';

            recognition.onresult = (event) => {
                interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Display both final and interim results
                voiceTranscript.textContent = finalTranscript + interimTranscript;

                // Auto-scroll to bottom
                voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMessage = 'Error: ';

                switch(event.error) {
                    case 'no-speech':
                        errorMessage += 'No speech detected. Try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMessage += 'No microphone found. Check your settings.';
                        break;
                    case 'not-allowed':
                        errorMessage += 'Microphone access denied. Please allow access.';
                        break;
                    default:
                        errorMessage += event.error;
                }

                voiceStatus.textContent = '❌ ' + errorMessage;
                voiceStatus.classList.remove('listening');
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Restart if it stops but we're still recording
                    recognition.start();
                }
            };

            try {
                recognition.start();
                console.log('Speech recognition started');
            } catch (err) {
                console.error('Failed to start recognition:', err);
                voiceStatus.textContent = '❌ Failed to start recording';
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!recognition) return;

            isRecording = false;
            recognition.stop();

            voiceRecordBtn.textContent = 'Start Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-primary';
            voiceStatus.textContent = '✓ Recording stopped';
            voiceStatus.classList.remove('listening');
            voiceTranscript.classList.remove('listening');

            if (voiceTranscript.textContent.trim()) {
                voiceCopyBtn.style.display = 'inline-block';
                voiceStatus.textContent = '✓ Transcript ready! Edit if needed, then copy.';
            }

            console.log('Speech recognition stopped');
        }

        // Copy transcript to clipboard
        voiceCopyBtn.addEventListener('click', async () => {
            const text = voiceTranscript.textContent.trim();

            if (!text) {
                voiceStatus.textContent = '❌ No text to copy';
                return;
            }

            // Try clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    voiceStatus.textContent = '✓ Copied to clipboard! Paste into terminal.';
                    voiceStatus.className = 'success';
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
        });

        function fallbackCopy(text) {
            // Fallback using execCommand
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            tempTextArea.style.position = 'absolute';
            tempTextArea.style.left = '-9999px';
            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            try {
                const copied = document.execCommand('copy');
                if (copied) {
                    voiceStatus.textContent = '✓ Copied! Paste into terminal.';
                    voiceStatus.className = 'success';
                } else {
                    voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
                }
            } catch (err) {
                voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
            }

            document.body.removeChild(tempTextArea);
        }

        // Keyboard shortcuts in voice modal
        voiceModal.addEventListener('keydown', (e) => {
            // Escape to close
            if (e.key === 'Escape') {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }

            // Enter to copy (if text exists and not recording)
            if (e.key === 'Enter' && !isRecording && voiceTranscript.textContent.trim()) {
                voiceCopyBtn.click();
            }

            // Space to start/stop recording (if not editing transcript)
            if (e.key === ' ' && e.target !== voiceTranscript) {
                e.preventDefault();
                voiceRecordBtn.click();
            }
        });

        // ---- Sidebar: file tree, recent changes, HA config check ----------
        // Everything is built with textContent; file names never become HTML.
        (function setupSidebar() {
            const sidebar = document.getElementById('sidebar');
            const list = document.getElementById('sidebar-list');
            const tabs = document.querySelectorAll('.sidebar-tab');
            const showHidden = document.getElementById('show-hidden');
            const hiddenToggle = document.getElementById('hidden-toggle');
            const recentHours = document.getElementById('recent-hours');
            const refreshBtn = document.getElementById('sidebar-refresh');
            const checkBtn = document.getElementById('check-config-btn');
            const checkResult = document.getElementById('check-config-result');
            const previewModal = document.getElementById('preview-modal');
            const previewTitle = document.getElementById('preview-title');
            const previewMeta = document.getElementById('preview-meta');
            const previewBody = document.getElementById('preview-body');
            let currentTab = 'files';
            let previewPath = null;
            let selectedRow = null;
            let rootPath = '/config';

            function formatSize(bytes) {
                if (bytes == null) return '';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / 1024 / 1024).toFixed(1) + ' MB';
            }

            function formatAgo(mtime) {
                const seconds = Math.max(0, (Date.now() - mtime) / 1000);
                if (seconds < 60) return 'just now';
                if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
                if (seconds < 86400) return Math.floor(seconds / 3600) + ' h ago';
                return Math.floor(seconds / 86400) + ' d ago';
            }

            async function getJson(url) {
                const res = await fetch(url);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || res.statusText);
                return data;
            }

            function emptyRow(text, depth = 0) {
                const row = document.createElement('div');
                row.className = 'tree-empty';
                row.style.paddingLeft = (12 + depth * 14) + 'px';
                row.textContent = text;
                return row;
            }

            function makeRow(entry, depth, meta) {
                const row = document.createElement('div');
                row.className = 'tree-row';
                row.style.paddingLeft = (8 + depth * 14) + 'px';
                row.title = entry.path;
                const twisty = document.createElement('span');
                twisty.className = 'tree-twisty';
                twisty.textContent = entry.type === 'dir' ? '▸' : '';
                const icon = document.createElement('span');
                icon.textContent = entry.type === 'dir' ? '📁' : '📄';
                const name = document.createElement('span');
                name.className = 'tree-name';
                name.textContent = entry.name;
                row.append(twisty, icon, name);
                if (meta) {
                    const metaEl = document.createElement('span');
                    metaEl.className = 'tree-meta';
                    metaEl.textContent = meta;
                    row.append(metaEl);
                }
                return row;
            }

            function select(row) {
                if (selectedRow) selectedRow.classList.remove('selected');
                selectedRow = row;
                row.classList.add('selected');
            }

            // Render one folder level into `container`; folders expand lazily
            async function renderFolder(folderPath, container, depth) {
                container.replaceChildren(emptyRow('Loading…', depth));
                let data;
                try {
                    data = await getJson('api/files?path=' + encodeURIComponent(folderPath));
                } catch (err) {
                    container.replaceChildren(emptyRow('⚠️ ' + err.message, depth));
                    return;
                }
                const entries = data.entries.filter((e) => showHidden.checked || !e.name.startsWith('.'));
                container.replaceChildren();
                if (!entries.length) container.append(emptyRow('(empty)', depth));
                for (const entry of entries) {
                    const row = makeRow(entry, depth, entry.type === 'file' ? formatSize(entry.size) : '');
                    container.append(row);
                    if (entry.type === 'dir') {
                        const children = document.createElement('div');
                        children.style.display = 'none';
                        container.append(children);
                        let loaded = false;
                        row.addEventListener('click', () => {
                            select(row);
                            const open = children.style.display === 'none';
                            children.style.display = open ? 'block' : 'none';
                            row.firstChild.textContent = open ? '▾' : '▸';
                            if (open && !loaded) {
                                loaded = true;
                                renderFolder(entry.path, children, depth + 1);
                            }
                        });
                    } else {
                        row.addEventListener('click', () => { select(row); openPreview(entry.path); });
                    }
                }
                if (data.truncated) container.append(emptyRow('… more entries not shown', depth));
            }

            async function renderRecent() {
                list.replaceChildren(emptyRow('Loading…'));
                let data;
                try {
                    data = await getJson('api/recent?hours=' + encodeURIComponent(recentHours.value));
                } catch (err) {
                    list.replaceChildren(emptyRow('⚠️ ' + err.message));
                    return;
                }
                list.replaceChildren();
                if (!data.entries.length) {
                    list.append(emptyRow('Nothing changed in this period'));
                    return;
                }
                for (const entry of data.entries) {
                    // Show the path relative to the root so you can tell
                    // packages/x.yaml from automations.yaml
                    const shown = { ...entry, name: entry.path.startsWith(rootPath + '/') ? entry.path.slice(rootPath.length + 1) : entry.path };
                    const row = makeRow(shown, 0, formatAgo(entry.mtime));
                    row.addEventListener('click', () => { select(row); openPreview(entry.path); });
                    list.append(row);
                }
            }

            const acceptBtn = document.getElementById('accept-changes-btn');
            const revertBtn = document.getElementById('preview-revert-btn');
            let diffPath = null;
            let revertArmed = null;

            async function postJson(url) {
                const res = await fetch(url, { method: 'POST' });
                const data = await res.json().catch(() => ({}));
                if (!res.ok && data.ok === undefined) throw new Error(data.error || res.statusText);
                return data;
            }

            async function renderChanges() {
                list.replaceChildren(emptyRow('Loading…'));
                acceptBtn.style.display = 'none';
                let data;
                try {
                    data = await getJson('api/git/status');
                } catch (err) {
                    list.replaceChildren(emptyRow('⚠️ ' + err.message));
                    return;
                }
                list.replaceChildren();
                if (!data.repo) {
                    const note = document.createElement('div');
                    note.className = 'changes-note';
                    note.append(
                        'Track changes in ' + data.configDir + ' to see exactly what Claude edits, line by line, and undo any file.',
                        document.createElement('br'), document.createElement('br'),
                        'This creates a local git repository there and saves the current state as the starting point. Nothing is uploaded anywhere. secrets.yaml, .storage, databases and logs are left out.'
                    );
                    const start = document.createElement('button');
                    start.className = 'sidebar-action';
                    start.textContent = 'Start tracking changes';
                    start.addEventListener('click', async () => {
                        start.disabled = true;
                        start.textContent = 'Setting up… (can take a minute)';
                        try {
                            const r = await postJson('api/git/init');
                            setStatus((r.ok ? '✅ ' : '❌ ') + r.message, r.ok ? 'success' : 'error');
                        } catch (err) {
                            setStatus('❌ ' + err.message, 'error');
                        }
                        renderChanges();
                    });
                    note.append(start);
                    list.append(note);
                    return;
                }
                if (data.error) {
                    list.append(emptyRow('⚠️ ' + data.error));
                    return;
                }
                if (data.lastCheckpoint) {
                    const since = emptyRow('Since checkpoint ' + formatAgo(data.lastCheckpoint.time));
                    since.title = data.lastCheckpoint.subject;
                    list.append(since);
                }
                if (!data.files.length) {
                    list.append(emptyRow('No changes'));
                    return;
                }
                acceptBtn.style.display = 'block';
                const letters = { modified: 'M', added: 'A', deleted: 'D', renamed: 'R' };
                for (const file of data.files) {
                    const row = document.createElement('div');
                    row.className = 'tree-row';
                    row.title = file.path;
                    const status = document.createElement('span');
                    status.className = 'change-status ' + file.status;
                    status.textContent = letters[file.status] || '?';
                    const name = document.createElement('span');
                    name.className = 'tree-name';
                    name.textContent = file.path;
                    row.append(status, name);
                    row.addEventListener('click', () => { select(row); openDiff(file.path); });
                    list.append(row);
                }
            }

            // Colour a unified diff line by line, as text nodes only
            function renderDiff(diff) {
                const frag = document.createDocumentFragment();
                for (const line of diff.split('\n')) {
                    const span = document.createElement('span');
                    span.className = 'diff-line';
                    if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('diff ') || line.startsWith('index ') || line.startsWith('new file') || line.startsWith('deleted file')) span.classList.add('diff-meta');
                    else if (line.startsWith('+')) span.classList.add('diff-add');
                    else if (line.startsWith('-')) span.classList.add('diff-del');
                    else if (line.startsWith('@@')) span.classList.add('diff-hunk');
                    span.textContent = line || ' ';
                    frag.append(span);
                }
                return frag;
            }

            function disarmRevert() {
                clearTimeout(revertArmed);
                revertArmed = null;
                revertBtn.classList.remove('confirm');
                revertBtn.textContent = '↩ Revert file';
            }

            async function openDiff(relativePath) {
                diffPath = relativePath;
                disarmRevert();
                revertBtn.style.display = '';
                previewPath = null;
                previewTitle.textContent = relativePath;
                previewMeta.textContent = 'Changes since the last checkpoint';
                previewBody.textContent = 'Loading…';
                previewModal.classList.add('active');
                try {
                    const data = await getJson('api/git/diff?path=' + encodeURIComponent(relativePath));
                    previewPath = data.fullPath;
                    previewBody.replaceChildren();
                    if (data.binary) previewBody.textContent = '(binary file changed)';
                    else if (!data.diff.trim()) previewBody.textContent = '(no differences)';
                    else previewBody.append(renderDiff(data.diff));
                    if (data.truncated) previewMeta.textContent += ' · showing the first 512 KB';
                } catch (err) {
                    previewBody.textContent = '⚠️ ' + err.message;
                }
            }

            revertBtn.addEventListener('click', async () => {
                if (!diffPath) return;
                // Two clicks: the first arms it, the second within 4 s reverts
                if (!revertArmed) {
                    revertBtn.classList.add('confirm');
                    revertBtn.textContent = 'Click again to revert';
                    revertArmed = setTimeout(disarmRevert, 4000);
                    return;
                }
                disarmRevert();
                try {
                    const r = await postJson('api/git/revert?path=' + encodeURIComponent(diffPath));
                    setStatus((r.ok ? '↩ ' : '❌ ') + r.message, r.ok ? 'success' : 'error');
                    if (r.ok) closePreview();
                } catch (err) {
                    setStatus('❌ ' + err.message, 'error');
                }
                if (currentTab === 'changes') renderChanges();
            });

            let acceptArmed = null;
            acceptBtn.addEventListener('click', async () => {
                if (!acceptArmed) {
                    acceptBtn.textContent = 'Click again to accept';
                    acceptArmed = setTimeout(() => { acceptArmed = null; acceptBtn.textContent = '✓ Accept all changes'; }, 4000);
                    return;
                }
                clearTimeout(acceptArmed);
                acceptArmed = null;
                acceptBtn.disabled = true;
                acceptBtn.textContent = 'Saving checkpoint…';
