                try {
                    const r = await postJson('api/git/checkpoint');
                    setStatus((r.ok ? '✅ ' : '❌ ') + r.message, r.ok ? 'success' : 'error');
                } catch (err) {
                    setStatus('❌ ' + err.message, 'error');
                } finally {
                    acceptBtn.disabled = false;
                    acceptBtn.textContent = '✓ Accept all changes';
                    renderChanges();
                }
            });

            function refresh() {
                hiddenToggle.style.display = currentTab === 'files' ? '' : 'none';
                recentHours.style.display = currentTab === 'recent' ? '' : 'none';
                acceptBtn.style.display = 'none';
                if (currentTab === 'files') renderFolder(rootPath, list, 0);
                else if (currentTab === 'recent') renderRecent();
                else renderChanges();
            }

            async function openPreview(filePath) {
                previewPath = filePath;
                diffPath = null;
                revertBtn.style.display = 'none';
                previewTitle.textContent = filePath;
                previewMeta.textContent = '';
                previewBody.textContent = 'Loading…';
                previewModal.classList.add('active');
                try {
                    const data = await getJson('api/file?path=' + encodeURIComponent(filePath));
                    previewMeta.textContent = formatSize(data.size) + ' · modified ' + new Date(data.mtime).toLocaleString() +
                        (data.truncated ? ' · showing the first 256 KB' : '');
                    previewBody.textContent = data.binary ? '(binary file, no preview)' : data.content;
                } catch (err) {
                    previewBody.textContent = '⚠️ ' + err.message;
                }
            }

            function closePreview() {
                previewModal.classList.remove('active');
            }

            function setOpen(open) {
                sidebar.classList.toggle('collapsed', !open);
                try { localStorage.setItem('sidebarOpen', open ? '1' : '0'); } catch { /* private mode */ }
                if (open && !list.childElementCount) refresh();
            }

            document.getElementById('files-btn').addEventListener('click', () => {
                setOpen(sidebar.classList.contains('collapsed'));
            });
            document.getElementById('sidebar-hide').addEventListener('click', () => setOpen(false));
            document.getElementById('rail-expand').addEventListener('click', () => setOpen(true));
            document.querySelectorAll('[data-open-tab]').forEach((btn) => btn.addEventListener('click', () => {
                setOpen(true);
                const tab = document.querySelector('.sidebar-tab[data-tab="' + btn.dataset.openTab + '"]');
                if (tab && currentTab !== tab.dataset.tab) tab.click();
            }));

            // Drag the edge to resize; the width is remembered
            const resizer = document.getElementById('sidebar-resizer');
            try {
                const savedWidth = parseInt(localStorage.getItem('sidebarWidth'), 10);
                if (savedWidth >= 180 && savedWidth <= 800) sidebar.style.width = savedWidth + 'px';
            } catch { /* private mode */ }
            resizer.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                resizer.classList.add('dragging');
                document.body.classList.add('resizing');
                const right = sidebar.getBoundingClientRect().right;
                const onMove = (ev) => {
                    const width = Math.min(Math.max(right - ev.clientX, 180), Math.min(800, window.innerWidth - 200));
                    sidebar.style.width = width + 'px';
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    resizer.classList.remove('dragging');
                    document.body.classList.remove('resizing');
                    try { localStorage.setItem('sidebarWidth', parseInt(sidebar.style.width, 10)); } catch { /* private mode */ }
                };
                // On window, not the handle: the pointer leaves the 5px
                // handle as soon as it moves
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            });

            tabs.forEach((tab) => tab.addEventListener('click', () => {
                tabs.forEach((t) => t.classList.toggle('active', t === tab));
                currentTab = tab.dataset.tab;
                refresh();
            }));
            showHidden.addEventListener('change', refresh);
            recentHours.addEventListener('change', refresh);
            refreshBtn.addEventListener('click', refresh);

            document.getElementById('preview-insert-btn').addEventListener('click', () => {
                if (!previewPath) return;
                closePreview();
                // On a phone the sidebar covers the terminal
                if (window.matchMedia('(max-width: 700px)').matches) setOpen(false);
                autoCopyAndPaste(previewPath);
            });
            document.getElementById('preview-copy-btn').addEventListener('click', async () => {
                if (previewPath) {
                    await copyToClipboard(previewPath);
                    setStatus('📋 Path copied', 'success');
                }
            });
            document.getElementById('preview-close-btn').addEventListener('click', closePreview);
            previewModal.addEventListener('click', (e) => { if (e.target === previewModal) closePreview(); });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && previewModal.classList.contains('active')) closePreview();
            });

            checkBtn.addEventListener('click', async () => {
                checkBtn.disabled = true;
                checkResult.className = '';
                checkResult.textContent = 'Checking… (this can take a minute)';
                try {
                    const res = await fetch('api/ha/check', { method: 'POST' });
                    const data = await res.json();
                    checkResult.className = data.ok ? 'ok' : 'error';
                    checkResult.textContent = (data.ok ? '✅ ' : '❌ ') + data.message;
                } catch (err) {
                    checkResult.className = 'error';
                    checkResult.textContent = '❌ ' + err.message;
                } finally {
                    checkBtn.disabled = false;
                }
            });

            getJson('api/roots').then((data) => {
                if (data.roots && data.roots[0]) rootPath = data.roots[0];
            }).catch(() => {}).finally(() => {
                let saved = '0';
                try { saved = localStorage.getItem('sidebarOpen') || '0'; } catch { /* private mode */ }
                if (saved === '1' && !window.matchMedia('(max-width: 700px)').matches) setOpen(true);
            });
        })();

        console.log('Voice input module loaded');
    </script>
</body>
</html>
