<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Terminal Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #header {
            background: #2d2d2d;
            padding: 8px 16px;
            border-bottom: 1px solid #3d3d3d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        #header-title {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }

        /* One fixed height for every header button. Emoji sit on a larger em
           box than the label text, so without this each button takes its height
           from its own icon and the row comes out ragged. */
        .header-btn {
            background: #007acc;
            color: white;
            border: none;
            height: 30px;
            padding: 0 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            line-height: 1;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* The icon span: sized on its own so it cannot stretch the button. */
        .header-btn > span:first-child {
            font-size: 14px;
            line-height: 1;
            display: block;
        }

        .header-btn:hover {
            background: #005a9e;
        }

        .header-btn:active {
            background: #004578;
        }

        .header-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #voice-btn.recording {
            background: #d9534f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #status {
            font-size: 12px;
            color: #888;
            padding: 0 12px;
            transition: all 0.2s ease;
        }

        #status.success {
            color: #4ec9b0;
        }

        #status.error {
            color: #f48771;
        }

        #status:hover {
            opacity: 0.8;
        }

        #status[style*="cursor: pointer"] {
            user-select: all;
        }

        #terminal-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #terminal-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #1e1e1e;
        }

        #drop-zone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 122, 204, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }

        #drop-zone.active {
            display: flex;
        }

        #drop-zone-text {
            font-size: 24px;
            font-weight: 500;
            color: white;
            text-align: center;
        }

        #file-input {
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Voice Modal */
        #voice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #voice-modal.active {
            display: flex;
        }

        #voice-modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #3d3d3d;
        }

        #voice-modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: #fff;
        }

        #voice-transcript {
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
            color: #ccc;
            font-size: 14px;
            line-height: 1.5;
        }

        #voice-transcript.listening {
            border-color: #d9534f;
        }

        #voice-transcript:empty::before {
            content: "Click 'Start Recording' and speak...";
            color: #666;
            font-style: italic;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .modal-btn-primary {
            background: #007acc;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #005a9e;
        }

        .modal-btn-danger {
            background: #d9534f;
            color: white;
        }

        .modal-btn-danger:hover {
            background: #c9302c;
        }

        .modal-btn-secondary {
            background: #555;
            color: white;
        }

        .modal-btn-secondary:hover {
            background: #666;
        }

        #voice-status {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            min-height: 18px;
        }

        #voice-status.listening {
            color: #d9534f;
        }

        /* Copy modal: the only way to copy on a touch device, where xterm.js
           has no selection at all. */
        #copy-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        #copy-modal.active {
            display: flex;
        }

        #copy-modal-content {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 16px;
            max-width: 700px;
            width: 94%;
            border: 1px solid #3d3d3d;
        }

        #copy-modal-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #fff;
        }

        #copy-hint {
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
        }

        /* A real textarea, so a long-press gives the native mobile
           selection handles and the OS copy menu. */
        #copy-text {
            width: 100%;
            height: 45vh;
            background: #1e1e1e;
            border: 1px solid #3d3d3d;
            border-radius: 4px;
            padding: 10px;
            color: #ddd;
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            line-height: 1.45;
            white-space: pre;
            overflow: auto;
            resize: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .copy-options {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 10px 0;
            font-size: 12px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .copy-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #copy-status {
            font-size: 12px;
            color: #888;
            min-height: 18px;
            margin-bottom: 8px;
        }

        #copy-status.success {
            color: #5cb85c;
        }

        #copy-status.error {
            color: #d9534f;
        }

        /* The link button appears on its own when a URL shows up in the
           terminal, so copying an OAuth link is one tap and no selecting. */
        #link-btn {
            background: #2ea043;
        }

        #link-btn:hover {
            background: #268a39;
        }

        #link-btn.copied {
            background: #1a7f37;
        }

        /* Phones: the button labels do not fit next to the title. */
        @media (max-width: 700px) {
            #header-title {
                display: none;
            }

            #header {
                justify-content: flex-end;
            }

            /* Icon-only, so make them square rather than letting the padding
               decide the width per emoji. */
            .header-btn {
                width: 38px;
                height: 34px;
                padding: 0;
            }

            .header-btn > span:first-child {
                font-size: 16px;
            }

            .header-btn .btn-label {
                display: none;
            }

            .modal-buttons {
                flex-wrap: wrap;
            }

            .modal-btn {
                flex: 1 1 auto;
                padding: 12px 16px;
                font-size: 14px;
            }

            #copy-text {
                height: 40vh;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="header-title">Claude Terminal Pro - Voice & image support</div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="status"></span>
                <button id="link-btn" class="header-btn" title="Copy the link shown in the terminal" style="display: none;">
                    <span>🔗</span>
                    <span class="btn-label">Copy link</span>
                </button>
                <button id="copy-btn" class="header-btn" title="Copy terminal text">
                    <span>📋</span>
                    <span class="btn-label">Copy</span>
                </button>
                <button id="voice-btn" class="header-btn">
                    <span>🎤</span>
                    <span class="btn-label">Voice Input</span>
                </button>
                <button id="upload-btn" class="header-btn">
                    <span>📎</span>
                    <span class="btn-label">Upload Image</span>
                </button>
            </div>
        </div>
        <div id="terminal-container">
            <iframe id="terminal-frame" src="about:blank"></iframe>
            <div id="drop-zone">
                <div id="drop-zone-text">Drop image here to upload</div>
            </div>
        </div>
    </div>
    <input type="file" id="file-input" accept="image/*">

    <!-- Copy Modal: touch devices cannot select terminal text at all -->
    <div id="copy-modal">
        <div id="copy-modal-content">
            <div id="copy-modal-title">📋 Copy terminal text</div>
            <div id="copy-hint">Long-press in the box to select part of it, or use "Copy all".</div>
            <div id="copy-status"></div>
            <textarea id="copy-text" readonly spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
            <div class="copy-options">
                <label><input type="radio" name="copy-scope" value="screen" checked> Visible screen</label>
                <label><input type="radio" name="copy-scope" value="all"> Full scrollback</label>
                <label id="copy-scope-selection" style="display: none;"><input type="radio" name="copy-scope" value="selection"> Selection</label>
            </div>
            <div class="copy-options">
                <label title="tmux breaks long lines at the pane width; rejoining them keeps URLs in one piece">
                    <input type="checkbox" id="copy-join" checked> Rejoin wrapped lines
                </label>
            </div>
            <div class="modal-buttons">
                <button id="copy-url-btn" class="modal-btn modal-btn-primary" style="display: none;">Copy link</button>
                <button id="copy-all-btn" class="modal-btn modal-btn-primary">Copy all</button>
                <button id="copy-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Voice Input Modal -->
    <div id="voice-modal">
        <div id="voice-modal-content">
            <div id="voice-modal-title">🎤 Voice Input</div>
            <div id="voice-status"></div>
            <div id="voice-transcript" contenteditable="true"></div>
            <div class="modal-buttons">
                <button id="voice-record-btn" class="modal-btn modal-btn-danger">Start Recording</button>
                <button id="voice-copy-btn" class="modal-btn modal-btn-primary" style="display: none;">Copy Text</button>
                <button id="voice-close-btn" class="modal-btn modal-btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <script src="terminal-clipboard.js"></script>
    <script>
        let ttydPort = 7681;
        let uploadDir = '/data/images';

        // Fetch configuration and load ttyd
        // Use relative paths for Home Assistant ingress compatibility
        fetch('config')
            .then(res => res.json())
            .then(config => {
                ttydPort = config.ttydPort;
                uploadDir = config.uploadDir;
                console.log('Config loaded:', config);
                // Load ttyd via proxy endpoint
                loadTerminal();
            })
            .catch(err => {
                console.error('Failed to load config:', err);
                // Fallback: load terminal anyway
                loadTerminal();
            });

        function loadTerminal() {
            const iframe = document.getElementById('terminal-frame');
            // Use relative path for Home Assistant ingress compatibility
            iframe.src = 'terminal/';
            // ttyd cannot copy an xterm.js selection on its own, and ignores OSC 52
            installTerminalClipboard(iframe);
        }

        // Fixes mouse-selection copy and Claude Code's /copy (OSC 52) inside ttyd.
        let clipboardBridge = null;

        function installTerminalClipboard(iframe) {
            const bridge = window.ClaudeTerminalClipboard;
            if (!bridge) {
                console.warn('terminal-clipboard.js not loaded, terminal copy will not work');
                return;
            }
            clipboardBridge = bridge.attach(iframe, {
                onError: (err) => console.error('Clipboard bridge failed:', err),
                onTimeout: () => console.warn('Terminal did not expose window.term, clipboard bridge inactive'),
                // Only reachable for /copy on a plain-HTTP origin, where the
                // browser has no clipboard API and refuses the fallback without
                // a user gesture. Say so and point at a button that has one.
                onRefused: () => setStatus(
                    'The browser blocked /copy over plain HTTP — use 📋 instead (or open Home Assistant over HTTPS)',
                    'error',
                    true
                )
            });
        }

        const status = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        function setStatus(message, type = '', persistent = false) {
            status.textContent = message;
            status.className = type;
            if (message && !persistent) {
                setTimeout(() => setStatus(''), 5000);
            }
        }

        async function uploadImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                setStatus('Please select an image file', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            uploadBtn.innerHTML = '<span class="spinner"></span><span>Uploading...</span>';
            uploadBtn.disabled = true;

            try {
                // Use relative path for Home Assistant ingress compatibility
                const response = await fetch('upload', {
                    method: 'POST',
                    body: formData
                });

                // Check if response is ok (status 200-299)
                if (!response.ok) {
                    const text = await response.text();
                    let errorMessage = 'Upload failed';
                    try {
                        const errorJson = JSON.parse(text);
                        errorMessage = errorJson.error || errorMessage;
                    } catch {
                        errorMessage = text || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const result = await response.json();

                if (result.success) {
                    const filePath = result.path;

                    // Display full path persistently with click-to-copy functionality
                    setStatus(`📋 ${filePath} (click to select)`, 'success', true);
                    console.log('Image uploaded:', filePath);

                    // Make status clickable to select text (works in iframes)
                    status.style.cursor = 'pointer';
                    status.style.userSelect = 'text';

                    status.onclick = () => {
                        // Try modern clipboard API first
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(filePath)
                                .then(() => {
                                    const originalText = status.textContent;
                                    setStatus('✓ Copied!', 'success', false);
                                    setTimeout(() => {
                                        setStatus(originalText, 'success', true);
                                    }, 2000);
                                })
                                .catch(() => {
                                    selectText();
                                });
                        } else {
                            // Fallback: select the text so user can copy with Cmd+C
                            selectText();
                        }
                    };

                    // Auto-copy to clipboard and try to paste into terminal
                    autoCopyAndPaste(filePath);

                    // Helper to select text (works in all contexts)
                    function selectText() {
                        const range = document.createRange();
                        const selection = window.getSelection();

                        // Clear any existing selection
                        selection.removeAllRanges();

                        // Create a temporary text node with just the path
                        const tempDiv = document.createElement('div');
                        tempDiv.style.position = 'absolute';
                        tempDiv.style.left = '-9999px';
                        tempDiv.textContent = result.path;
                        document.body.appendChild(tempDiv);

                        // Select the path text
                        range.selectNodeContents(tempDiv);
                        selection.addRange(range);

                        // Try execCommand as fallback for copying
                        try {
                            const copied = document.execCommand('copy');
                            if (copied) {
                                setStatus('✓ Copied! (Cmd+C)', 'success', false);
                            } else {
                                setStatus('✓ Selected! Press Cmd+C to copy', 'success', false);
                            }
                        } catch (err) {
                            setStatus('✓ Selected! Press Cmd+C to copy', 'success', false);
                        }

                        // Clean up and restore message
                        setTimeout(() => {
                            document.body.removeChild(tempDiv);
                            selection.removeAllRanges();
                            setStatus(`📋 ${result.path} (click to select)`, 'success', true);
                        }, 3000);
                    }
                } else {
                    setStatus(result.error || 'Upload failed', 'error');
                }
            } catch (error) {
                console.error('Upload error:', error);
                setStatus('Upload failed: ' + error.message, 'error');
            } finally {
                uploadBtn.innerHTML = '<span>📎</span><span>Upload Image</span>';
                uploadBtn.disabled = false;
            }
        }

        // Upload button click
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadImage(e.target.files[0]);
            }
        });

        // Paste handling
        document.addEventListener('paste', async (e) => {
            console.log('Paste event detected');
            const items = e.clipboardData?.items;

            if (!items) {
                console.log('No clipboard items found');
                return;
            }

            console.log('Clipboard items:', Array.from(items).map(i => i.type));

            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    console.log('Image found in clipboard:', item.type);
                    e.preventDefault();
                    const file = item.getAsFile();
                    if (file) {
                        console.log('File extracted from clipboard:', file.name, file.size);
                        await uploadImage(file);
                    } else {
                        console.error('Failed to extract file from clipboard item');
                    }
                    break;
                }
            }
        });

        // Also handle paste on window for better compatibility
        window.addEventListener('paste', async (e) => {
            // This ensures paste works even when iframe has focus
            console.log('Window paste event detected');
        });

        // Drag and drop handling
        let dragCounter = 0;

        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dragCounter++;
            if (dragCounter === 1) {
                dropZone.classList.add('active');
            }
        });

        document.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dragCounter--;
            if (dragCounter === 0) {
                dropZone.classList.remove('active');
            }
        });

        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });

        document.addEventListener('drop', async (e) => {
            e.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('active');

            const files = e.dataTransfer?.files;
            if (files && files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    await uploadImage(file);
                } else {
                    setStatus('Please drop an image file', 'error');
                }
            }
        });

        // Auto-copy path and attempt to paste into terminal
        async function autoCopyAndPaste(filePath) {
            const iframe = document.getElementById('terminal-frame');

            // Step 1: Copy to clipboard
            const copied = await copyToClipboard(filePath);

            if (copied) {
                // Step 2: Focus the terminal iframe
                try {
                    iframe.contentWindow.focus();
                    iframe.focus();

                    // Step 3: Try to send the text directly
                    // Note: This might not work due to iframe security, but we'll try
                    setTimeout(() => {
                        // Try to trigger a paste event in the iframe
                        const pasteEvent = new ClipboardEvent('paste', {
                            clipboardData: new DataTransfer(),
                            bubbles: true,
                            cancelable: true
                        });

                        // Try to add the text to the clipboard data
                        try {
                            pasteEvent.clipboardData.setData('text/plain', filePath);
                        } catch (e) {
                            console.log('Cannot set clipboard data in event:', e);
                        }

                        iframe.contentWindow.document.dispatchEvent(pasteEvent);

                        // Alternative: Try to send keyboard events
                        sendTextToTerminal(filePath);

                        setStatus(`📋 ${filePath} - Ready to use! (path in clipboard)`, 'success', true);
                    }, 100);

                } catch (err) {
                    console.log('Cannot access iframe for auto-paste:', err);
                    setStatus(`📋 ${filePath} - Copied! Paste into terminal (Cmd+V)`, 'success', true);
                }
            }
        }

        // Helper to copy text to clipboard
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (err) {
                    console.log('Clipboard API failed, trying fallback:', err);
                    return fallbackCopyToClipboard(text);
                }
            } else {
                return fallbackCopyToClipboard(text);
            }
        }

        // Fallback clipboard copy using execCommand
        function fallbackCopyToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'absolute';
            textArea.style.left = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();

            try {
                const copied = document.execCommand('copy');
                document.body.removeChild(textArea);
                return copied;
            } catch (err) {
                document.body.removeChild(textArea);
                return false;
            }
        }

        // Try to send text to terminal by simulating keyboard input
        function sendTextToTerminal(text) {
            const iframe = document.getElementById('terminal-frame');

            // Try to send each character as a keyboard event
            // This might not work due to iframe restrictions, but worth trying
            try {
                const iframeDoc = iframe.contentWindow.document;
                const terminal = iframeDoc.querySelector('.xterm-helper-textarea') ||
                               iframeDoc.querySelector('textarea') ||
                               iframeDoc.body;

                if (terminal) {
                    // Try to insert text
                    if (terminal.value !== undefined) {
                        terminal.value = text;
                        terminal.dispatchEvent(new Event('input', { bubbles: true }));
                    }

                    // Try to send keyboard events for each character
                    for (const char of text) {
                        const keyEvent = new KeyboardEvent('keypress', {
                            key: char,
                            char: char,
                            keyCode: char.charCodeAt(0),
                            bubbles: true
                        });
                        terminal.dispatchEvent(keyEvent);
                    }

                    console.log('Attempted to send text to terminal');
                }
            } catch (err) {
                console.log('Cannot send keyboard events to iframe:', err);
                // This is expected due to cross-origin restrictions
                // The clipboard copy is the fallback
            }
        }

        // Prevent default drag behavior on iframe
        window.addEventListener('load', () => {
            const iframe = document.getElementById('terminal-frame');
            iframe.addEventListener('dragover', (e) => e.preventDefault());
            iframe.addEventListener('drop', (e) => e.preventDefault());
        });

        // --- Copy terminal text: the only path a touch device has ---
        // xterm.js has no touch selection and paints to a canvas, so a finger
        // selects nothing. Read the buffer into a textarea instead, where a
        // long-press gives the native handles.

        const copyModal = document.getElementById('copy-modal');
        const copyBtn = document.getElementById('copy-btn');
        const copyTextArea = document.getElementById('copy-text');
        const copyStatus = document.getElementById('copy-status');
        const copyAllBtn = document.getElementById('copy-all-btn');
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const copyCloseBtn = document.getElementById('copy-close-btn');
        const copyScopeSelection = document.getElementById('copy-scope-selection');
        const copyJoin = document.getElementById('copy-join');

        function currentCopyScope() {
            const checked = document.querySelector('input[name="copy-scope"]:checked');
            return checked ? checked.value : 'screen';
        }

        function setCopyStatus(message, type = '') {
            copyStatus.textContent = message;
            copyStatus.className = type;
        }

        function terminalController() {
            return clipboardBridge ? clipboardBridge.getController() : null;
        }

        function refreshCopyText() {
            const controller = terminalController();
            if (!controller) {
                copyTextArea.value = '';
                setCopyStatus('Terminal is not ready yet.', 'error');
                return;
            }
            copyTextArea.value = controller.read(currentCopyScope(), copyJoin.checked);

            // Ask the terminal, not the textarea: rebuilding a link that was
            // split across rows needs the row geometry, which the flattened
            // text no longer has.
            const found = controller.findLink();
            copyUrlBtn.style.display = found.url ? 'block' : 'none';
            copyUrlBtn.dataset.url = found.url || '';
            if (found.url) {
                setCopyStatus('Found a link — "Copy link" copies just that.');
            } else if (found.problem === 'truncated') {
                setCopyStatus('A link is on screen but cut off — try "Full scrollback".', 'error');
            } else {
                setCopyStatus('');
            }
        }

        function openCopyModal() {
            const controller = terminalController();
            // Only offer the "Selection" scope when there actually is one
            // (desktop with a mouse); on a phone there never is.
            const hasSelection = !!(controller && controller.hasSelection());
            copyScopeSelection.style.display = hasSelection ? 'flex' : 'none';
            if (hasSelection) {
                copyScopeSelection.querySelector('input').checked = true;
            } else if (currentCopyScope() === 'selection') {
                document.querySelector('input[name="copy-scope"][value="screen"]').checked = true;
            }

            refreshCopyText();
            copyModal.classList.add('active');
        }

        function closeCopyModal() {
            copyModal.classList.remove('active');
            setCopyStatus('');
        }

        copyBtn.addEventListener('click', openCopyModal);
        copyCloseBtn.addEventListener('click', closeCopyModal);
        copyModal.addEventListener('click', (e) => {
            if (e.target === copyModal) closeCopyModal();
        });
        document.querySelectorAll('input[name="copy-scope"]').forEach((radio) => {
            radio.addEventListener('change', refreshCopyText);
        });
        copyJoin.addEventListener('change', refreshCopyText);

        copyUrlBtn.addEventListener('click', async () => {
            const url = copyUrlBtn.dataset.url;
            if (!url) return;

            if (await copyToClipboard(url)) {
                setCopyStatus(`✓ Copied the link (${url.length} chars).`, 'success');
                return;
            }
            // Select just the link so the OS copy menu picks it up.
            const at = copyTextArea.value.indexOf(url);
            copyTextArea.focus();
            if (at !== -1) copyTextArea.setSelectionRange(at, at + url.length);
            setCopyStatus('Could not copy automatically - the link is selected, use your device\'s Copy.', 'error');
        });

        // The tap on this button is the user gesture that the execCommand
        // fallback needs, so this works on plain HTTP too.
        copyAllBtn.addEventListener('click', async () => {
            const text = copyTextArea.value;
            if (!text) {
                setCopyStatus('Nothing to copy.', 'error');
                return;
            }

            if (await copyToClipboard(text)) {
                setCopyStatus(`✓ Copied ${text.split('\n').length} lines.`, 'success');
                return;
            }

            // Last resort: hand it to the OS selection UI.
            copyTextArea.focus();
            copyTextArea.setSelectionRange(0, text.length);
            setCopyStatus('Could not copy automatically - the text is selected, use your device\'s Copy.', 'error');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && copyModal.classList.contains('active')) closeCopyModal();
        });

        // --- One-tap link copy ---
        // What people copy is almost always a login URL, and selecting it by
        // finger is painful even above. Watch for one and offer a button; the
        // tap is also the gesture the execCommand fallback needs.

        const linkBtn = document.getElementById('link-btn');
        let pendingLink = null;

        const LINK_PROBLEM_MESSAGE = {
            none: 'No link on screen',
            truncated: 'The link on screen is cut off - scroll so all of it is visible',
            invalid: 'That does not look like a complete link'
        };

        function scanForLink() {
            const controller = terminalController();
            if (!controller) return;

            const url = controller.findLink().url;
            if (url === pendingLink) return;

            pendingLink = url;
            linkBtn.style.display = url ? 'inline-flex' : 'none';
            linkBtn.classList.remove('copied');
            // Shows the host on hover, so it is obvious what will be copied.
            linkBtn.title = url ? `Copy ${url}` : 'Copy the link shown in the terminal';
        }

        setInterval(scanForLink, 1500);

        linkBtn.addEventListener('click', async () => {
            // Re-check on the tap rather than trusting the 1.5s poll: the
            // screen may have changed, and a stale truncated link is exactly
            // the "unfinished http..." that is worse than no link at all.
            const controller = terminalController();
            const found = controller ? controller.findLink() : { url: null, problem: 'none' };

            if (!found.url) {
                pendingLink = null;
                linkBtn.style.display = 'none';
                setStatus(LINK_PROBLEM_MESSAGE[found.problem] || LINK_PROBLEM_MESSAGE.none, 'error');
                return;
            }

            pendingLink = found.url;
            if (await copyToClipboard(found.url)) {
                linkBtn.classList.add('copied');
                // Name the host: on a phone there is no hover, so this is the
                // only way to see which link was taken when several are up.
                let host = found.url;
                try { host = new URL(found.url).host; } catch (err) { /* keep the raw URL */ }
                setStatus(`✓ Copied link to ${host} (${found.url.length} chars)`, 'success');
                return;
            }

            // Copy was refused: fall back to the dialog, where the link is
            // preselected for the OS copy menu.
            setStatus('Could not copy automatically - opening the copy dialog', 'error');
            openCopyModal();
            const at = copyTextArea.value.indexOf(found.url);
            if (at !== -1) {
                copyTextArea.focus();
                copyTextArea.setSelectionRange(at, at + found.url.length);
            }
        });

        // ========================================
        // Voice Input with Web Speech API
        // ========================================

        const voiceBtn = document.getElementById('voice-btn');
        const voiceModal = document.getElementById('voice-modal');
        const voiceRecordBtn = document.getElementById('voice-record-btn');
        const voiceCopyBtn = document.getElementById('voice-copy-btn');
        const voiceCloseBtn = document.getElementById('voice-close-btn');
        const voiceTranscript = document.getElementById('voice-transcript');
        const voiceStatus = document.getElementById('voice-status');

        let recognition = null;
        let isRecording = false;

        // Check if Web Speech API is supported
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();

            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // Default to English, can be made configurable

            console.log('Web Speech API is supported!');
        } else {
            console.warn('Web Speech API is not supported in this browser');
            voiceBtn.disabled = true;
            voiceBtn.title = 'Voice input not supported in this browser';
        }

        // Open voice modal
        voiceBtn.addEventListener('click', () => {
            voiceModal.classList.add('active');
            voiceTranscript.textContent = '';
            voiceStatus.textContent = '';
            voiceCopyBtn.style.display = 'none';
        });

        // Close voice modal
        voiceCloseBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            }
            voiceModal.classList.remove('active');
        });

        // Click outside modal to close
        voiceModal.addEventListener('click', (e) => {
            if (e.target === voiceModal) {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }
        });

        // Start/Stop recording
        voiceRecordBtn.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        function startRecording() {
            if (!recognition) {
                voiceStatus.textContent = '❌ Speech recognition not available';
                voiceStatus.className = 'error';
                return;
            }

            isRecording = true;
            voiceRecordBtn.textContent = 'Stop Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-danger';
            voiceStatus.textContent = '🎤 Listening... (speak now)';
            voiceStatus.classList.add('listening');
            voiceTranscript.classList.add('listening');

            let finalTranscript = '';
            let interimTranscript = '';

            recognition.onresult = (event) => {
                interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;

                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // Display both final and interim results
                voiceTranscript.textContent = finalTranscript + interimTranscript;

                // Auto-scroll to bottom
                voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let errorMessage = 'Error: ';

                switch(event.error) {
                    case 'no-speech':
                        errorMessage += 'No speech detected. Try speaking again.';
                        break;
                    case 'audio-capture':
                        errorMessage += 'No microphone found. Check your settings.';
                        break;
                    case 'not-allowed':
                        errorMessage += 'Microphone access denied. Please allow access.';
                        break;
                    default:
                        errorMessage += event.error;
                }

                voiceStatus.textContent = '❌ ' + errorMessage;
                voiceStatus.classList.remove('listening');
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    // Restart if it stops but we're still recording
                    recognition.start();
                }
            };

            try {
                recognition.start();
                console.log('Speech recognition started');
            } catch (err) {
                console.error('Failed to start recognition:', err);
                voiceStatus.textContent = '❌ Failed to start recording';
                isRecording = false;
            }
        }

        function stopRecording() {
            if (!recognition) return;

            isRecording = false;
            recognition.stop();

            voiceRecordBtn.textContent = 'Start Recording';
            voiceRecordBtn.className = 'modal-btn modal-btn-primary';
            voiceStatus.textContent = '✓ Recording stopped';
            voiceStatus.classList.remove('listening');
            voiceTranscript.classList.remove('listening');

            if (voiceTranscript.textContent.trim()) {
                voiceCopyBtn.style.display = 'inline-block';
                voiceStatus.textContent = '✓ Transcript ready! Edit if needed, then copy.';
            }

            console.log('Speech recognition stopped');
        }

        // Copy transcript to clipboard
        voiceCopyBtn.addEventListener('click', async () => {
            const text = voiceTranscript.textContent.trim();

            if (!text) {
                voiceStatus.textContent = '❌ No text to copy';
                return;
            }

            // Try clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    voiceStatus.textContent = '✓ Copied to clipboard! Paste into terminal.';
                    voiceStatus.className = 'success';
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
        });

        function fallbackCopy(text) {
            // Fallback using execCommand
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            tempTextArea.style.position = 'absolute';
            tempTextArea.style.left = '-9999px';
            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            try {
                const copied = document.execCommand('copy');
                if (copied) {
                    voiceStatus.textContent = '✓ Copied! Paste into terminal.';
                    voiceStatus.className = 'success';
                } else {
                    voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
                }
            } catch (err) {
                voiceStatus.textContent = '⚠️ Select text above and press Cmd+C to copy';
            }

            document.body.removeChild(tempTextArea);
        }

        // Keyboard shortcuts in voice modal
        voiceModal.addEventListener('keydown', (e) => {
            // Escape to close
            if (e.key === 'Escape') {
                if (isRecording) {
                    stopRecording();
                }
                voiceModal.classList.remove('active');
            }

            // Enter to copy (if text exists and not recording)
            if (e.key === 'Enter' && !isRecording && voiceTranscript.textContent.trim()) {
                voiceCopyBtn.click();
            }

            // Space to start/stop recording (if not editing transcript)
            if (e.key === ' ' && e.target !== voiceTranscript) {
                e.preventDefault();
                voiceRecordBtn.click();
            }
        });

        console.log('Voice input module loaded');
    </script>
</body>
</html>
